<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1360" viewBox="0 0 1900 1360" role="img" aria-labelledby="title desc">
<title id="title">Local Voice-Interactive AI System — Seven-Service Architecture</title>
<desc id="desc">Windows-native seven-service integration with unified startup and shutdown, readiness, resource checks, strict process ownership and continuous monitoring. WebSocket orchestrates speech recognition, the CPU language model and speech synthesis. The Avatar Controller bridges generated audio to LiveTalking and Wav2Lip; WebRTC delivers audio and video directly to the browser. Browser WAV fallback is retained.</desc>
