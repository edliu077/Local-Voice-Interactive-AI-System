<text x="100" y="185" font-size="29" fill="#234e40" font-weight="700">Windows Unified Management</text>
<text x="100" y="221" font-size="23" fill="#28433b" font-weight="400">Unified Startup / Shutdown  •  Service Readiness  •  Continuous Resource Monitoring</text>
<text x="100" y="254" font-size="21" fill="#28433b" font-weight="400">RAM / Commit / Paging / GPU checks  •  PID / FILETIME / exe / command line / process tree / owner / ports</text>
<text x="100" y="284" font-size="19" fill="#28433b" font-weight="400">Safe shutdown and cleanup of verified owned processes; identity conflicts fail closed. These safeguards are not an all-failure stability guarantee.</text>
<rect x="55" y="348" width="1790" height="859" rx="24" fill="none" stroke="#a6baaf" stroke-dasharray="10 8"/>
<text x="80" y="380" font-size="18" fill="#6c7e71" font-weight="600">SEVEN LOCAL SERVICES  •  Numbers indicate the existing startup order, not the processing order.</text>
