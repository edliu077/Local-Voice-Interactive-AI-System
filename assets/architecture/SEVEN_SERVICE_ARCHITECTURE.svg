<g><rect x="600" y="610" width="400" height="135" rx="18" fill="#fffdfa" stroke="#baa58a" stroke-width="2"/><circle cx="631" cy="644" r="16" fill="#baa58a"/><text x="626" y="650" font-size="16" fill="#fff" font-weight="700">3</text><text x="660" y="651" font-size="22" fill="#213b39" font-weight="700">Qwen3-TTS  :8765</text><text x="624" y="686" font-size="18" fill="#243a38" font-weight="400">0.6B Base · CUDA</text><text x="624" y="713" font-size="18" fill="#243a38" font-weight="400">原声音克隆 · 返回合成 WAV / 元数据</text></g>
<g><rect x="1125" y="610" width="400" height="155" rx="18" fill="#efe8f8" stroke="#9672b2" stroke-width="2"/><circle cx="1156" cy="644" r="16" fill="#9672b2"/><text x="1151" y="650" font-size="16" fill="#fff" font-weight="700">2</text><text x="1185" y="651" font-size="22" fill="#213b39" font-weight="700">Avatar 控制器  :8011</text><text x="1149" y="686" font-size="18" fill="#243a38" font-weight="400">受控会话 / 绑定 / 取消</text><text x="1149" y="713" font-size="18" fill="#243a38" font-weight="400">WS → 可信内部音频提交</text><text x="1149" y="740" font-size="18" fill="#243a38" font-weight="400">音频适配、分块 → LiveTalking</text></g>
