<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
<title id="title">本地语音交互AI系统 — 七服务架构</title>
<desc id="desc">Windows统一管理与资源监护。WebSocket调度STT、LLM、TTS，经Avatar音频桥送入LiveTalking和Wav2Lip，通过WebRTC回到浏览器。保留WAV回退。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#567e78" stroke-width="1.5"/></marker><marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#ad8756" stroke-width="1.5"/></marker><marker id="arrowBack" markerWidth="10" markerHeight="10" refX="0" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#567e78" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1130" fill="#f6f2ea"/>
<g font-family="Microsoft YaHei UI,Microsoft YaHei,Segoe UI,sans-serif">
<text x="65" y="65" font-size="38" fill="#183d35" font-weight="700">本地语音交互AI系统</text>
<text x="65" y="101" font-size="21" fill="#62736b" font-weight="400">Local Voice-Interactive AI System  /  Seven-Service Architecture</text>
<rect x="65" y="135" width="1470" height="116" rx="18" fill="#e5f0eb" stroke="#659381" stroke-width="2"/>
<text x="90" y="174" font-size="25" fill="#234e40" font-weight="700">Windows 统一管理 · 启动 / 就绪登记 / 持续监护 / 安全停止</text>
<text x="90" y="207" font-size="19" fill="#243a38" font-weight="400">Start-Rebuild.cmd / Stop-Rebuild.cmd    ·    RAM / Commit / 分页 / GPU    ·    PID / FILETIME / owner / 端口 / 进程树</text>
<text x="90" y="235" font-size="17" fill="#243a38" font-weight="400">管理器覆盖以下全部七项服务；只回收身份已核实的本次自有进程，冲突保留证据并拒绝接管。</text>
<rect x="50" y="290" width="1500" height="694" rx="22" fill="none" stroke="#a6baaf" stroke-dasharray="9 7"/>
<text x="78" y="317" font-size="16" fill="#65796e" font-weight="600">WINDOWS 原生七服务  ·  圆标编号为现有启动顺序</text>
<g><rect x="75" y="350" width="400" height="135" rx="18" fill="#fffdfa" stroke="#baa58a" stroke-width="2"/><circle cx="106" cy="384" r="16" fill="#baa58a"/><text x="101" y="390" font-size="16" fill="#fff" font-weight="700">1</text><text x="135" y="391" font-size="22" fill="#213b39" font-weight="700">Next.js  :3000</text><text x="99" y="426" font-size="18" fill="#243a38" font-weight="400">页面 → Edge / Chrome 浏览器</text><text x="99" y="453" font-size="18" fill="#243a38" font-weight="400">连接 / 字幕 / 状态 / 播放反馈</text></g>
